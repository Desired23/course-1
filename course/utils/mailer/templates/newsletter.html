<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{ subject }}</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
.container { max-width: 600px; margin: auto; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.header { background: #4f46e5; color: #fff; text-align: center; padding: 20px; }
.content { padding: 24px; color: #333; line-height: 1.6; }
.footer { text-align: center; font-size: 12px; color: #777; padding: 15px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>{{ subject }}</h2>
  </div>
  <div class="content">
    {{ content|safe }}
  </div>
  <div class="footer">
    © {{ site_name }} - Học tập cùng bạn.
  </div>
</div>
</body>
</html>
