<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #111827; line-height: 1.5;">
    <p>Xin chao {{ user_name }},</p>
    <h2 style="font-size: 18px; margin: 0 0 12px;">{{ title }}</h2>
    <p><strong>Noi dung:</strong> {{ course_title }}</p>
    <p>{{ message }}</p>
    {% if deadline_at %}
      <p><strong>Han phan hoi:</strong> {{ deadline_at }}</p>
    {% endif %}
    {% if action_url %}
      <p>
        <a href="{{ action_url }}" style="display: inline-block; padding: 10px 14px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px;">
          Mo trang xu ly
        </a>
      </p>
      <p style="font-size: 12px; color: #6b7280;">{{ action_url }}</p>
    {% endif %}
    <p style="font-size: 12px; color: #6b7280;">Neu can ho tro, vui long lien he {{ support_email }}.</p>
  </body>
</html>
